services:

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - database-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-php:
    build:
      context: ../backend
      dockerfile: .docker/php.Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: UFUQ
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: https://api.ufuq-group.com

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"

      CACHE_STORE: database
      QUEUE_CONNECTION: database

      FILESYSTEM_DISK: local

      MAIL_MAILER: log

      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax

    volumes:
      - ${BACKEND_STORAGE_PATH}:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-nginx:
    build:
      context: ../backend
      dockerfile: .docker/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_HOST_PORT}:80"
    volumes:
      - ${BACKEND_STORAGE_PATH}:/var/www/html/storage:ro
    depends_on:
      backend-php:
        condition: service_healthy
    networks:
      - edge-network
      - backend-network

  queue-worker:
    build:
      context: ../backend
      dockerfile: .docker/php.Dockerfile
    restart: unless-stopped
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=90"
      ]
    environment:
      APP_NAME: UFUQ
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"

      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database

    volumes:
      - ${BACKEND_STORAGE_PATH}:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-network

  scheduler:
    build:
      context: ../backend
      dockerfile: .docker/php.Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_NAME: UFUQ
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"

      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database

    volumes:
      - ${BACKEND_STORAGE_PATH}:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-network

  ufuq-web:
    build:
      context: ../ufuq
      dockerfile: .docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    networks:
      - frontend-network

  dashboard-web:
    build:
      context: ../dashboard
      dockerfile: .docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT}:80"
    networks:
      - frontend-network

networks:

  frontend-network:
    driver: bridge

  edge-network:
    driver: bridge

  backend-network:
    driver: bridge
    internal: true

volumes:
  database-data:
