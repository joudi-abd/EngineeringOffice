<a class="kicker" routerLink="/services">الخدمات</a>
<div class="panel">
  <h1>{{ id() ? 'تعديل الخدمة' : 'خدمة جديدة' }}</h1>
  <form class="fields" [formGroup]="form" (ngSubmit)="save()">
    <label>
      <span>الاسم</span>
      <input formControlName="name" />
    </label>
    <label>
      <span>وصف قصير</span>
      <textarea formControlName="short_description"></textarea>
    </label>
    <label>
      <span>الوصف</span>
      <textarea formControlName="description"></textarea>
    </label>
    <label>
      <span>الأيقونة</span>
      <app-select formControlName="icon" [options]="iconOptions" placeholder="اختر أيقونة للخدمة" />
    </label>
    <div class="field-group">
      <span>الصورة</span>
      <label class="filepick">
        <span class="filepick__preview">
          @if (imageUrl()) {
            <img [src]="imageUrl()!" alt="" />
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM4 15l4.5-4.5 4 4 3-3L20 16M9 9.5h.01" /></svg>
          }
        </span>
        <span class="filepick__text">
          <strong>{{ fileName() || (imageUrl() ? 'تغيير الصورة' : 'اختيار صورة') }}</strong>
          <small>JPG أو PNG أو WebP</small>
        </span>
        <input type="file" accept="image/*" (change)="onFile($event)" hidden />
      </label>
    </div>
    <label class="check">
      <input type="checkbox" formControlName="is_active" />
      <span>ظاهرة في الموقع</span>
    </label>
    @if (error()) { <p class="error">{{ error() }}</p> }
    <div class="actions">
      <button class="btn" type="submit" [disabled]="busy()">حفظ</button>
      <a class="btn-quiet" routerLink="/services">رجوع</a>
    </div>
  </form>
</div>
