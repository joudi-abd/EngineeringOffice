<div class="page-head">
  <div>
    <p class="kicker">ما يقدمه المكتب</p>
    <h1>الخدمات</h1>
  </div>
  <a class="btn" routerLink="/services/new">خدمة جديدة</a>
</div>
@if (error()) { <p class="error">{{ error() }}</p> }
<div class="table-wrap">
  <table>
    <thead>
      <tr><th>الاسم</th><th>الحالة</th><th></th></tr>
    </thead>
    <tbody>
      @for (item of page()?.items ?? []; track item.id) {
        <tr>
          <td>{{ item.name }}</td>
          <td><span class="pill" [class.pill--off]="!item.is_active">{{ item.is_active ? 'ظاهرة' : 'مخفية' }}</span></td>
          <td>
            <div class="row-actions">
              <a [routerLink]="['/services', item.id]">تعديل</a>
              <button type="button" (click)="remove(item)">حذف</button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="3">لا توجد خدمات.</td></tr>
      }
    </tbody>
  </table>
</div>
@if ((page()?.meta?.last_page ?? 1) > 1) {
  <div class="pager">
    <button class="btn-quiet" type="button" [disabled]="page()!.meta!.current_page <= 1" (click)="load(page()!.meta!.current_page - 1)">السابق</button>
    <button class="btn-quiet" type="button" [disabled]="page()!.meta!.current_page >= page()!.meta!.last_page" (click)="load(page()!.meta!.current_page + 1)">التالي</button>
  </div>
}
