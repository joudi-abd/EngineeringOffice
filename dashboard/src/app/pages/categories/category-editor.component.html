<a class="kicker" routerLink="/categories">التصنيفات</a>
<div class="panel">
  <h1>{{ id() ? 'تعديل التصنيف' : 'تصنيف جديد' }}</h1>
  <form class="fields" [formGroup]="form" (ngSubmit)="save()">
    <label>
      <span>الاسم</span>
      <input formControlName="name" />
    </label>
    <label>
      <span>الوصف</span>
      <textarea formControlName="description"></textarea>
    </label>
    <label class="check">
      <input type="checkbox" formControlName="is_active" />
      <span>ظاهر في الموقع</span>
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <div class="actions">
      <button class="btn" type="submit" [disabled]="busy()">حفظ</button>
      <a class="btn-quiet" routerLink="/categories">رجوع</a>
    </div>
  </form>
</div>
