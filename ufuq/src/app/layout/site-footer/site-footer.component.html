@let c = i18n.content();

<footer class="foot">
  <div class="foot__grid">
    <div class="foot__brand">
      <img
        class="foot__logo"
        [src]="logo() || (i18n.lang() === 'ar' ? 'brand/logo-ar-light.png' : 'brand/logo-en-light.png')"
        [alt]="site.companyName()"
      />
      <p class="quiet">{{ blurb() }}</p>
      <app-social-links class="foot__social" [label]="c.footer.socialLabel" />
    </div>

    <nav class="foot__nav" [attr.aria-label]="c.footer.navLabel">
      @for (item of c.nav; track item.id) {
        <a [href]="item.href || '#' + item.id" (click)="sections.open($event, item)">{{ item.label }}</a>
      }
    </nav>

    <div class="foot__contact">
      @if (phone()) {
        <a dir="ltr" [href]="phoneLink()">{{ phone() }}</a>
      }
      @if (email()) {
        <a dir="ltr" [href]="emailLink()" target="_blank" rel="noopener noreferrer">{{ email() }}</a>
      }
      @if (address()) {
        <p>{{ address() }}</p>
      }
      @if (hours()) {
        <p>{{ hours() }}</p>
      }
    </div>
  </div>

  <p class="foot__copy">© {{ year }} {{ rights() }}</p>
</footer>
