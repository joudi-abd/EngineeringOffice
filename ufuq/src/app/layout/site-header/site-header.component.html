@let c = i18n.content();

<header class="top" [class.top--solid]="scrolled() || menuOpen()">
  <a class="logo" href="#top" [attr.aria-label]="c.hero.label" (click)="follow($event, 'top')">
    <img
      class="logo__img"
      [src]="logo() || (i18n.lang() === 'ar' ? 'brand/logo-ar-light.png' : 'brand/logo-en-light-compact.png')"
      [alt]="site.companyName()"
    />
  </a>

  <nav class="links" [attr.aria-label]="c.navLabel">
    @for (item of c.nav; track item.id) {
      <a
        class="links__item"
        [class.is-on]="isCurrent(item)"
        [href]="item.href || '#' + item.id"
        (click)="open($event, item)"
      >{{ item.label }}</a>
    }
  </nav>

  <div class="actions">
    <button class="lang" type="button" (click)="i18n.toggle()" [attr.aria-label]="c.langLabel">
      {{ c.langSwitch }}
    </button>
    <button
      class="burger"
      type="button"
      [attr.aria-label]="menuOpen() ? c.menuClose : c.menuOpen"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-menu"
      (click)="toggleMenu($event)"
    >
      <span></span>
      <span></span>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="drawer" id="site-menu" (click)="$event.stopPropagation()">
      @for (item of c.nav; track item.id) {
        <a
          [class.is-on]="isCurrent(item)"
          [href]="item.href || '#' + item.id"
          (click)="open($event, item)"
        >{{ item.label }}</a>
      }
      @if (phone()) {
        <a class="drawer__phone" [href]="phoneLink()"><bdi dir="ltr">{{ phone() }}</bdi></a>
      }
    </div>
  }
</header>
