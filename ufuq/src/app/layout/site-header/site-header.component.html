@let c = i18n.content();

<header class="top" [class.top--solid]="scrolled() || menuOpen()">
  <a class="logo" href="#top" [attr.aria-label]="c.hero.label" (click)="follow($event, 'top')">
    <img
      class="logo__img"
      [src]="logo() || artwork()"
      [alt]="site.companyName()"
    />
  </a>

  <nav class="links" [attr.aria-label]="c.navLabel">
    @for (item of c.nav; track item.id) {
      <a
        class="links__item"
        [class.is-on]="isCurrent(item)"
        [href]="item.href || '#' + item.id"
        (click)="open($event, item)"
      >{{ item.label }}</a>
    }
  </nav>

  <div class="actions">
    <a
      class="icon"
      routerLink="/profile"
      [attr.aria-label]="auth.user() ? account().profile + ': ' + auth.displayName() : account().signIn"
      [attr.title]="auth.user() ? account().profile : account().signIn"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8.5" r="3.6" />
        <path d="M4.6 20c.7-3.9 3.7-6 7.4-6s6.7 2.1 7.4 6" />
      </svg>
      @if (auth.user()) {
        <span class="icon__dot" aria-hidden="true"></span>
      }
    </a>
    <button
      class="icon"
      type="button"
      [attr.aria-label]="theme.theme() === 'dark' ? themeCopy().toLight : themeCopy().toDark"
      [attr.title]="theme.theme() === 'dark' ? themeCopy().toLight : themeCopy().toDark"
      (click)="theme.toggle()"
    >
      @if (theme.theme() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z" />
        </svg>
      }
    </button>
    <button class="lang" type="button" (click)="i18n.toggle()" [attr.aria-label]="c.langLabel">
      {{ c.langSwitch }}
    </button>
    <button
      class="burger"
      type="button"
      [attr.aria-label]="menuOpen() ? c.menuClose : c.menuOpen"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-menu"
      (click)="toggleMenu($event)"
    >
      <span></span>
      <span></span>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="drawer" id="site-menu" (click)="$event.stopPropagation()">
      @for (item of c.nav; track item.id) {
        <a
          [class.is-on]="isCurrent(item)"
          [href]="item.href || '#' + item.id"
          (click)="open($event, item)"
        >{{ item.label }}</a>
      }
      @if (auth.user()) {
        <a class="drawer__profile" routerLink="/profile" (click)="closeMenu()">{{ account().profile }} <bdi>({{ auth.displayName() }})</bdi></a>
        <button class="drawer__out" type="button" (click)="signOut()">
          {{ account().signOut }} <bdi>({{ auth.displayName() }})</bdi>
        </button>
      }
      @if (phone()) {
        <a class="drawer__phone" [href]="phoneLink()"><bdi dir="ltr">{{ phone() }}</bdi></a>
      }
    </div>
  }
</header>
