<label>
  <span class="label">{{ label() }}</span>
  <span class="secret">
    <input [type]="type()" dir="ltr" [attr.autocomplete]="autocomplete()" [value]="value()" (input)="edit($event)" />
    <button
      class="eye"
      type="button"
      [attr.aria-label]="shown() ? copy().hidePassword : copy().showPassword"
      [attr.aria-pressed]="shown()"
      (mousedown)="$event.preventDefault()"
      (click)="toggle()"
    >
      @if (shown()) {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 3l18 18" />
          <path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4.1M6.5 6.6A16.6 16.6 0 0 0 2.5 12S6 19 12 19c1.5 0 2.9-.4 4.1-1" />
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      }
    </button>
  </span>
  @if (hint()) {
    <small>{{ hint() }}</small>
  }
</label>
