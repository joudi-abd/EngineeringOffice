<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <link rel="preload" href="/fonts/montserrat-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/cairo-var.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    try {
      var storedLang = localStorage.getItem('ufuq-lang');
      if (storedLang === 'en' || storedLang === 'ar') {
        document.documentElement.lang = storedLang;
        document.documentElement.dir = storedLang === 'ar' ? 'rtl' : 'ltr';
      }
    } catch (e) {}
    try {
      var storedTheme = localStorage.getItem('ufuq-theme');
      var light = storedTheme ? storedTheme === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    } catch (e) {}
  </script>
  <meta charset="utf-8">
  <title>أفق إمبريوم | مكتب هندسي</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مكتب أفق إمبريوم للهندسة والعمارة والتصميم الداخلي والإنشاء والإشراف على الموقع.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preload" as="image" href="images/hero.jpg">
</head>
<body>
  <app-root></app-root>
</body>
</html>
