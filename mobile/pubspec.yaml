name: ufuq_imperium
description: "UFUQ Imperium engineering office app"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  path_drawing: ^1.0.1
  intl: ^0.20.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/images/

  fonts:
    - family: Bukra
      fonts:
        - asset: assets/fonts/bukra-light.ttf
          weight: 300
        - asset: assets/fonts/bukra-regular.ttf
          weight: 400
        - asset: assets/fonts/bukra-bold.ttf
          weight: 700
    - family: NeuePower
      fonts:
        - asset: assets/fonts/neue-power-light.ttf
          weight: 300
        - asset: assets/fonts/neue-power-regular.ttf
          weight: 400
        - asset: assets/fonts/neue-power-medium.ttf
          weight: 500
        - asset: assets/fonts/neue-power-bold.ttf
          weight: 700

# App icon: sources live in icon/ (not bundled in the app).
# Regenerate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/app-icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#F2F0EB"
  adaptive_icon_foreground: "icon/app-icon-foreground.png"
